<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رسالة سرية لدميانة</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', Tahoma}
body{background:linear-gradient(135deg,#a78bfa,#7c3aed);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;width:100%;max-width:370px;border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .5s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.lock{font-size:48px}
h2{color:#6d28d9;margin:10px 0 5px}
.hint{color:#9ca3af;font-size:12px;margin-bottom:15px}
input{width:100%;padding:14px;border:2px solid #e9d5ff;border-radius:14px;text-align:center;font-size:16px;outline:none;transition:.2s}
input:focus{border-color:#7c3aed;background:#faf5ff}
button{width:100%;margin-top:12px;padding:13px;background:#7c3aed;color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:bold;cursor:pointer}
#error{display:none;color:#ef4444;margin-top:10px;font-size:13px}
#msg{display:none;margin-top:20px;text-align:right;background:#f5f3ff;padding:18px;border-radius:16px;line-height:1.9;color:#2d2d2d;border:1px dashed #c4b5fd}
#msg b{color:#7c3aed}
.footer{margin-top:15px;font-size:11px;color:#9ca3af}
</style>
</head>
<body>
<div class="card">
  <div class="lock">💌🔒</div>
  <h2>رسالة سرية</h2>
  <div class="hint">الباسورد: اسم بنت جميلة بتبدأ بحرف الـ د 😉</div>
  
  <input type="text" id="pass" placeholder="اكتبي الباسورد هنا">
  <button onclick="openMsg()">افتحي الرسالة</button>
  <div id="error">غلط 😂 حاولي تاني - اكتبي دميانة</div>

  <div id="msg">
    ازيك يا <b>دميانة</b> 😂<br><br>
    بلاش زعل علي الفون تاني 😂 كان باين عليكي اوي<br><br>
    وبعدين لي عملتي رجيم وكده 😂<br><br>
    <div style="text-align:left;margin-top:10px;font-style:italic;color:#7c3aed">
      - رسالة من فاعل خير 😂
    </div>
  </div>
  
  <div class="footer">Moka Gifts ✨</div>
</div>

<script>
function openMsg(){
  let p = document.getElementById('pass').value.trim();
  if(p === 'دميانة' || p === 'دميانه' || p === 'damyana' || p === 'Damyana' || p === 'دميانة '){
    document.getElementById('msg').style.display='block';
    document.getElementById('error').style.display='none';
  }else{
    document.getElementById('error').style.display='block';
    document.getElementById('msg').style.display='none';
  }
}
</script>
</body>
</html>
